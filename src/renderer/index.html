<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Quiz Console</title>
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body class="quiz">
        <div class="screen">
            <div class="video-stage">
                <video id="state-video" playsinline></video>
                <img id="state-image" alt="" />
            </div>
            <main class="card overlay">
                <section id="pin-section" class="pin-screen">
                    <p class="pin-instruction">Въведи своята парола</p>
                    <form id="pin-form" autocomplete="off">
                        <label class="sr-only" for="pin-input">PIN</label>
                        <input
                            id="pin-input"
                            type="password"
                            maxlength="6"
                            readonly
                            autocomplete="off"
                            inputmode="numeric"
                            class="sr-only"
                        />
                        <div id="pin-display" aria-hidden="true"></div>
                    </form>
                    <div id="pin-keypad" class="keypad pin-keypad">
                        <button type="button" data-key="1" class="pin-key">
                            1
                        </button>
                        <button type="button" data-key="2" class="pin-key">
                            2
                        </button>
                        <button type="button" data-key="3" class="pin-key">
                            3
                        </button>
                        <button type="button" data-key="4" class="pin-key">
                            4
                        </button>
                        <button type="button" data-key="5" class="pin-key">
                            5
                        </button>
                        <button type="button" data-key="6" class="pin-key">
                            6
                        </button>
                        <button type="button" data-key="7" class="pin-key">
                            7
                        </button>
                        <button type="button" data-key="8" class="pin-key">
                            8
                        </button>
                        <button type="button" data-key="9" class="pin-key">
                            9
                        </button>
                        <button
                            type="button"
                            data-key="clear"
                            class="pin-key pin-action error"
                            aria-label="Clear PIN"
                        >
                            <image src="./assets/erase.png" />
                        </button>
                        <button type="button" data-key="0" class="pin-key">
                            0
                        </button>
                        <button
                            type="button"
                            data-key="enter"
                            class="pin-key pin-action success"
                            aria-label="Submit PIN"
                        >
                            <image src="./assets/checkbox.png" />
                        </button>
                    </div>
                    <p id="pin-error" role="alert"></p>
                </section>

                <section id="wrong-pin-section" class="hidden pin-screen">
                </section>

                <section id="pre-quiz-section" class="hidden pre-quiz-screen">
                </section>

                <section id="question-section" class="hidden">
                    <header>
                        <p id="question-text"></>
                    </header>
                    <p id="config-warning" class="warning"></p>
                    <ul id="answer-list"></ul>
                    <p id="question-error" role="alert"></p>
                    <footer id="question-footer"></footer>
                </section>

                <section id="award-section" class="hidden award-screen">
                    <div class="award-prize">
                        <p id="award-name" class="award-name-display"></p>
                    </div>
                </section>

                <section id="lose-section" class="hidden award-screen">
                </section>
            </main>
        </div>
        <button id="config-hotspot" class="hotspot config" aria-label="Open configuration"></button>
        <button id="pin-hotspot" class="hotspot pin" aria-label="Show PIN screen"></button>
        <script src="./quizRenderer.js"></script>
    </body>
</html>
